plugins {
    // Pinned, not "3.5-SNAPSHOT"/"1.17-SNAPSHOT". Those track the latest CI build and DO move:
    // both 1.17.487 and 1.17.491 were resolved under the same snapshot coordinate during this port.
    // Across a six-repo stack that means repos can silently build against different Loom versions.
    id "architectury-plugin" version "3.5.169"
    // Minecraft 26.2 ships deobfuscated: Mojang no longer publishes client_mappings and Fabric
    // intermediary stops at 1.21.11. The no-remap Loom variant is the one that accepts an empty
    // 'mappings' configuration -- what architectury-api and figura-port both use at 26.2.
    // Two consequences, both of which fail confusingly if forgotten:
    //   * there are no mod* configurations (no modImplementation / modApi) -- nothing is remapped
    //   * :common exposes no namedElements variant -- depend on the plain project
    id "dev.architectury.loom-no-remap" version "1.17.491" apply false
    id "maven-publish"
}

architectury {
    minecraft = rootProject.mcVersion
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        // No `mappings` line: 26.2 is deobfuscated, so there is nothing to map.
        minecraft "com.mojang:minecraft:${rootProject.mcVersion}"

        if (rootProject.mixin.toBoolean()) {
            annotationProcessor "org.spongepowered:mixin:${rootProject.mixinVersion}:processor"
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "${rootProject.fileName}-${rootProject.mcVersion}"
    }

    group = rootProject.modGroup
    version = rootProject.version

    repositories {
        mavenLocal()
        maven {
            // Architectury
            url "https://maven.architectury.dev/"
        }
        maven {
            // NeoForged -- supplies net.neoforged:neoforge for the :neoforge platform project.
            url "https://maven.neoforged.net/releases/"
        }
        maven {
            // CurseForge
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            // Curios
            url "https://maven.theillusivec4.top"
            content {
                includeGroupByRegex "top\\.theillusivec4.*"
            }
        }
        maven {
            // The One Probe
            url "https://maven.k-4u.nl"
            content {
                includeGroup "mcjty.theoneprobe"
            }
        }
        maven {
            // Patchouli / JEI / Darkhax
            url "https://maven.blamejared.com"
            content {
                includeGroup "vazkii.patchouli"
                includeGroupByRegex "net\\.darkhax.*"
                includeGroupByRegex "com\\.blamejared.*"
                includeGroup "org.openzen.zencode"
                includeGroup "mezz.jei"
            }
        }
        maven {
            // Shadows
            url "https://maven.shadowsoffire.dev/releases"
            content {
                includeGroup "dev.shadowsoffire"
                includeGroup "snownee.jade"
            }
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.javaVersion)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = Integer.parseInt(rootProject.javaVersion)
        // javac stops reporting after 100 errors; during a port the error count IS the progress metric.
        options.compilerArgs << "-Xmaxerrs" << "2000"
    }
}
