// Phase 2a scaffold only -- no Fabric mod code yet. This subproject exists so that :common is built for
// the fabric platform too (platforms=fabric,neoforge), which keeps the common code honest: anything that
// would not compile against a non-NeoForge target fails here rather than in Phase 2b.
architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"
    implementation project(path: ":common")
}
