org.gradle.jvmargs=-Dfile.encoding=UTF-8
# org.gradle.configuration-cache=true

# Basic Information
fileName=Placebo
modName=Placebo
modGroup=dev.shadowsoffire
modid=placebo
author=Shadows_of_Fire
desc=1 (one) library boi
version=11.0.0

# Dependencies
mcVersion=26.2
javaVersion=25
forgeVersion=26.2.0.43-beta

# Multiloader (Architectury). Phase 2a ships NeoForge only; add "fabric," to platforms in Phase 2b.
platforms=fabric,neoforge
architecturyVersion=21.0.5
fabricLoaderVersion=0.19.3
fabricApiVersion=0.155.2+26.2
jeiVersion=30.16.0.130
# TODO(26.2): Jade's 26.2-neoforge branch is on 26.2.8, but no 26.2 artifact is mirrored to
# maven.shadowsoffire.dev yet (latest there is 26.1.2-26.1.3). Placebo has no Java-level Jade
# usage — this is a dev-runtime convenience only. Re-enable as jadeVersion=26.2.8 once uploaded.
#jadeVersion=26.0.9

# Mixins
mixin=true
mixinVersion=0.8.7

# Publishing
# Dependency lists are comma-separated. Each entry is "slug" (both platforms) or "curseforgeSlug|modrinthSlug".
#requiredDeps=
#optionalDeps=
#incompatibleDeps=
releaseType=release
modLoaders=NeoForge
curseforgeProjectId=283644
# Modrinth's base62 project ID (NOT the "placebo" slug) — from the project's settings page or /v2/project API.
modrinthProjectId=tCkE8p2N

# Tests
enableTests=false
