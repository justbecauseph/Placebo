plugins {
    id "com.gradleup.shadow" version "9.4.3"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    localImplementation
    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.forgeVersion}"

    api "dev.architectury:architectury-neoforge:${rootProject.architecturyVersion}"

    // loom-no-remap: :common has no namedElements variant -- nothing is mapped, so depend on the plain project.
    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    if (rootProject.hasProperty('jeiVersion'))    localImplementation "mezz.jei:jei-${rootProject.mcVersion}-neoforge:${rootProject.jeiVersion}"
    if (rootProject.hasProperty('jadeVersion'))   localImplementation "snownee.jade:Jade-NeoForge:${rootProject.mcVersion}-${rootProject.jadeVersion}"
    if (rootProject.hasProperty('curiosVersion')) localImplementation "top.theillusivec4.curios:curios-neoforge:${rootProject.curiosVersion}"
}

// loom-no-remap has no remapJar task -- nothing is remapped at 26.2, so shadowJar produces the
// final artifact directly. This mirrors figura-port and architectury-api on the same toolchain.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    zip64 = true
}

assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(":common").tasks.named("sourcesJar")
    dependsOn commonSources
    from commonSources.map { zipTree(it.archiveFile) }
}

// ---------------------------------------------------------------------------
// Mod metadata + mixin config generation.
//
// Ported from the pre-Architectury single-project build. The mixin scan now walks BOTH the common and
// neoforge mixin trees and emits one config: Phase 2a ships NeoForge only, so a single config listing
// all mixins is behaviour-identical to before. Phase 2b splits this into placebo-common.mixins.json
// (loader-neutral, vanilla targets) plus a platform config.
// ---------------------------------------------------------------------------

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.dir('src/templates')

    def mixinRoots = [
        file("${project(':common').projectDir}/src/main/java/dev/shadowsoffire/${rootProject.modid}/mixin"),
        file("${project.projectDir}/src/main/java/dev/shadowsoffire/${rootProject.modid}/mixin")
    ].findAll { it.exists() }

    mixinRoots.each { inputs.dir(it) }

    def replaceProperties = [
        modGroup    : rootProject.modGroup,
        modid       : rootProject.modid,
        version     : project.version,
        modName     : rootProject.modName,
        author      : rootProject.author,
        desc        : rootProject.desc,
        mcVersion   : rootProject.mcVersion,
        javaVersion : rootProject.javaVersion,
        forgeVersion: rootProject.forgeVersion
    ]

    def licenseFile = rootProject.file('LICENSE')
    if (!licenseFile.exists()) {
        throw new GradleException('Missing LICENSE file in repository root.')
    }
    replaceProperties.put 'license', licenseFile.readLines().get(0)

    ['placeboVersion', 'attributeslibVersion', 'curiosVersion', 'topVersion', 'patchouliVersion'].each { key ->
        if (rootProject.hasProperty(key)) replaceProperties.put(key, rootProject.property(key))
    }

    replaceProperties.put 'mixinConfig', rootProject.mixin.toBoolean() ? "[[mixins]]\nconfig=\"${rootProject.modid}.mixins.json\"" : ""

    inputs.properties replaceProperties

    from("src/templates")
    into("src/generated/resources")

    filesMatching('neoforge.mods.toml') {
        expand replaceProperties
        name 'META-INF/neoforge.mods.toml'
    }

    filesMatching('mixins.json') {
        def mixinFiles = []
        def clientMixinFiles = []

        mixinRoots.each { root ->
            fileTree(root).visit { FileVisitDetails details ->
                def name = details.file.path.replace(File.separator, '/')
                name = name.substring(name.indexOf('mixin/') + 'mixin/'.length())
                if (name.endsWith('.java')) {
                    name = name.substring(0, name.length() - '.java'.length()).replaceAll('/', '.')
                    (name.startsWith('client') ? clientMixinFiles : mixinFiles).add(name)
                }
            }
        }

        replaceProperties.put('mixins', mixinFiles.sort().collect { '        "' + it + '"' }.join(',\n'))
        replaceProperties.put('clientMixins', clientMixinFiles.sort().collect { '        "' + it + '"' }.join(',\n'))

        expand replaceProperties
        name "${rootProject.modid}.mixins.json".toString()
    }
}

tasks.named('processResources') { dependsOn generateModMetadata }
tasks.withType(Jar).configureEach { dependsOn generateModMetadata }

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Un-expanded templates visible in the IDE.
sourceSets {
    templates {
        resources { srcDir 'src/templates' }
    }
}

if (!rootProject.enableTests.toBoolean()) {
    sourceSets.remove(sourceSets.test)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : rootProject.fileName,
            "Specification-Vendor"    : rootProject.author,
            "Specification-Version"   : project.version,
            "Implementation-Title"    : rootProject.fileName,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : rootProject.author,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated true
            name = "NeoForge Client"
            property 'forge.enabledGameTestNamespaces', rootProject.modid
        }
        server {
            server()
            ideConfigGenerated true
            name = "NeoForge Server"
            programArgs '--nogui'
            property 'forge.enabledGameTestNamespaces', rootProject.modid
        }
        data {
            client()
            ideConfigGenerated true
            name = "NeoForge Data"
            programArgs '--mod', rootProject.modid, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }
}

publishing {
    repositories {
        maven {
            name = "shadowsMaven"
            url = "https://maven.shadowsoffire.dev/releases"
            credentials(PasswordCredentials)
            authentication { basic(BasicAuthentication) }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.modGroup
            artifactId = rootProject.fileName
            version = "${rootProject.mcVersion}-${project.version}"
            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0) node.remove(node.dependencies)
            }
            from components.java
        }
    }
}
